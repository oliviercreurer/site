<!doctype html>
<!--
    Case study template. Copy this file to a new page (e.g. importer.html)
    and replace everything marked TODO. Styles live in main.css under
    "Case study pages". The leading underscore keeps GitHub Pages from
    publishing this file.

    Case study colors (match the home page):
      Importer   var(--blue-highlight)
      Directory  var(--yellow-highlight)
      Modlist    var(--red-highlight)
      Norns      var(--green-highlight)
-->
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="main.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Outfit:wght@100..900&family=Stack+Sans+Headline:wght@200..700&family=Stack+Sans+Notch:wght@200..700&family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
        <title>TODO Title — Olivier Creurer</title>
        <script>
            // Apply stored theme before paint to avoid a flash
            (function () {
                var theme = localStorage.getItem("theme");
                if (theme !== "light" && theme !== "dark") {
                    theme = window.matchMedia("(prefers-color-scheme: dark)").matches
                        ? "dark"
                        : "light";
                }
                document.documentElement.style.colorScheme = theme;
                document.documentElement.dataset.theme = theme;
            })();
        </script>
        <script src="reveal.js"></script>
    </head>
    <!-- TODO: set --accent to this case study's color (colors the title) -->
    <body class="study" style="--accent: var(--blue-highlight);">

                        </ul>
                        <a href="index.html" class="back-button">Back</a>
                    </div>

                <p>TODO Body copy.</p>

                <figure>
                    <img src="images/TODO.png" alt="TODO" />
                    <figcaption>TODO Caption</figcaption>
                </figure>

                <p>TODO Body copy.</p>
            </article>

            <footer class="study-footer">
                <a href="index.html">Home</a>

        <script src="main.js" type="text/javascript"></script>
    </body>
</html>
