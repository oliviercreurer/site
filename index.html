<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="main.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Outfit:wght@100..900&family=Stack+Sans+Headline:wght@200..700&family=Stack+Sans+Notch:wght@200..700&family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
        <title>Olivier Creurer</title>
        <script>
            // Apply stored theme before paint to avoid a flash
            (function () {
                var theme = localStorage.getItem("theme");
                if (theme !== "light" && theme !== "dark") {
                    theme = window.matchMedia("(prefers-color-scheme: dark)").matches
                        ? "dark"
                        : "light";
                }
                document.documentElement.style.colorScheme = theme;
                document.documentElement.dataset.theme = theme;
            })();
        </script>
        <script>
            // Hold the entrance animation until web fonts are ready,
            // with a timeout so slow fonts never keep the page hidden
            (function () {
                var root = document.documentElement;
                root.classList.add("reveal-pending");
                function start() {
                    root.classList.remove("reveal-pending");
                }
                window.addEventListener("load", function () {
                    if (document.fonts) document.fonts.ready.then(start, start);
                    else start();
                });
                setTimeout(start, 3000);
            })();
        </script>
    </head>
    <body>
        <section class="hero hero-reveal">
            
            <div class="welcome-text">
                <span class="base" style="color: var(--text-light);"><strong>Olivier Creurer</strong> is a <span class="title">product designer</span> based in Montréal. <strong>Case Studies:</strong> 
            <a href="https://google.com"><span class="highlight" style="--highlight: var(--blue-highlight); --i: 0;">Importer</span></a>, 
            <a href="directory.html"><span class="highlight" style="--highlight: var(--yellow-highlight); --i: 1;">Directory</span></a>,
            <a href="https://google.com"><span class="highlight" style="--highlight: var(--red-highlight); --i: 2;">Modlist</span></a>, and
            <a href="https://google.com"><span class="highlight" style="--highlight: var(--green-highlight); --i: 3;">Norns</span></a>.
            </div>

            <nav class="nav-container">
                <div class="nav-end">
                    <div class="social-links">
                        <a href="https://github.com/oliviercreurer" target="_blank">Github</a>
                        <span>·</span>
                        <a href="https://google.com" target="_blank">LinkedIn</a>
                        <span>·</span>
                        <a href="https://google.com" target="_blank">Graphics</a>
                    </div>
                </div>
                <button type="button" class="contact">Contact</button>
            </nav>
            
        </section>

        <footer>
            <!-- <span class="caption">© 2025 | Olivier Creurer</span> -->
        </footer>

        <script src="main.js" type="text/javascript"></script>
    </body>
</html>
