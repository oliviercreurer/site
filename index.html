<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="main.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Stack+Sans+Headline:wght@200..700&family=Stack+Sans+Notch:wght@200..700&family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
        <title>Olivier Creurer</title>
        <script>
            // Apply stored theme before paint to avoid a flash
            (function () {
                var theme = localStorage.getItem("theme");
                if (theme === "light" || theme === "dark") {
                    document.documentElement.style.colorScheme = theme;
                }
            })();
        </script>
    </head>
    <body>
        <button type="button" class="contact">Contact</button>
        <section class="hero">
            <span class="base"><strong>Olivier Creurer</strong> is a <span class="title">product designer</span> based in Montréal. <strong>Case Studies:</strong> 
            <a href="https://google.com"><span class="highlight" style="color: var(--blue-highlight);">Importer</span></a>, 
            <a href="https://google.com"><span class="highlight" style="color: var(--yellow-highlight);">Directory</span></a>,
            <a href="https://google.com"><span class="highlight" style="color: var(--red-highlight);">Modlist</span></a>, and
            <a href="https://google.com"><span class="highlight" style="color: var(--green-highlight);">Norns</span></a>.
        </section>

        <footer>
            <!-- <span class="caption">© 2025 | Olivier Creurer</span> -->
            <button type="button" class="theme-toggle" aria-label="Toggle color theme">Theme</button>
        </footer>

        <script src="main.js" type="text/javascript"></script>
    </body>
</html>
